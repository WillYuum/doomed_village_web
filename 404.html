<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="apple-touch-icon" sizes="180x180" href="/public/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/public/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="/public/favicon_io/site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found — Cozy Lit Window</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1f2b33">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(var(--header-h) + 1rem) 1.5rem 3rem;
    }
    .not-found h1 { font-size: clamp(2rem, 8vw, 3.5rem); color: var(--sand-soft); margin: 0 0 1rem; }
    .not-found p { max-width: 30rem; margin: 0 0 2rem; font-size: clamp(1rem, 3vw, 1.2rem); }
    .not-found .home-btn {
      display: inline-block;
      padding: 0.7rem 1.8rem;
      color: var(--deep);
      background: var(--moss);
      border: 1px solid var(--edge);
      border-radius: 999px;
      text-decoration: none;
      font-size: 1.1rem;
      transition: background 0.2s, transform 0.2s;
    }
    .not-found .home-btn:hover { background: var(--sand-soft); transform: translateY(-2px); }
    .not-found .home-btn:focus-visible { outline: 2px solid var(--moss); outline-offset: 3px; }
  </style>
</head>

<body>

  <header class="site-header scrolled" id="site-header">
    <a class="brand" href="/" aria-label="Cozy Lit Window — home">
      <img src="/public/assets/Main_Logo_Inverted.png" alt="Cozy Lit Window">
    </a>
  </header>

  <main class="not-found">
    <h1>404 – Page Not Found</h1>
    <p>Looks like this window leads nowhere. The page you're looking for doesn't exist or may have moved. Let's get you back somewhere cozy.</p>
    <a class="home-btn" href="/">Back to Home</a>
  </main>

</body>

</html>
